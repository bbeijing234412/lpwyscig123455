<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyścig o LP — na żywo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0e14;
  --road: #23262f;
  --road-edge: #14161c;
  --panel: #151a26;
  --line: #262e42;
  --ink: #eef1f8;
  --ink-dim: #8992ab;
  --ink-faint: #565f78;
  --finish: #f2c14e;
  --danger: #e0526a;
  --tier-unranked: #5c6478;
  --tier-iron: #6b6360;
  --tier-bronze: #ab7644;
  --tier-silver: #aab5c0;
  --tier-gold: #e0ac1f;
  --tier-platinum: #3fcdb2;
  --tier-emerald: #27c67a;
  --tier-diamond: #57b3ec;
  --tier-master: #b073f7;
  --tier-grandmaster: #ef5b6d;
  --tier-challenger: #f7d774;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); }
body {
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--ink);
  padding: 28px 20px 60px;
  background-image:
    linear-gradient(rgba(11, 14, 20, 0.86), rgba(11, 14, 20, 0.86)),
    url('background.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
.wrap { max-width: 900px; margin: 0 auto; }
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
h1 {
  font-family: 'Chakra Petch', sans-serif;
  font-weight: 700;
  font-size: 30px;
  margin: 0;
}
h1 .flag { color: var(--finish); }
.status { font-size: 12px; color: var(--ink-faint); }
.status.stale { color: var(--danger); }
.finish-banner {
  position: relative;
  text-align: center;
  padding: 8px 0;
  margin-bottom: 14px;
  border-radius: 8px;
  overflow: hidden;
  background-image: repeating-conic-gradient(#eef1f8 0% 25%, #0b0e14 0% 50%);
  background-size: 16px 16px;
}
.finish-banner span {
  background: var(--bg);
  color: var(--finish);
  font-family: 'Chakra Petch', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.08em;
  padding: 4px 16px;
  border-radius: 5px;
  display: inline-block;
}
.lanes { display: flex; flex-direction: column; gap: 14px; }
.lane {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px 14px;
}
.lane-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.rank-num {
  font-family: 'Chakra Petch', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--ink-faint);
  width: 22px;
  flex-shrink: 0;
}
.lane:first-child .rank-num { color: var(--finish); }
.name-block {
  display: flex;
  flex-direction: column;
  margin-right: auto;
  line-height: 1.25;
}
.nickname-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  cursor: pointer;
}
.nickname-btn:hover { color: var(--finish); }
.nickname-btn .chevron {
  font-size: 10px;
  color: var(--ink-faint);
  transition: transform 0.2s ease;
}
.riot-id { font-size: 11px; color: var(--ink-faint); }
.stat {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 12px;
  color: var(--ink-dim);
  white-space: nowrap;
}
.wl { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }

/* --- expandable match history panel --- */
.match-panel {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
}
.match-panel.open {
  max-height: 420px;
  opacity: 1;
  margin-top: 10px;
}
.match-loading, .match-error, .match-empty {
  font-size: 12px;
  color: var(--ink-faint);
  padding: 10px 2px;
}
.match-error { color: var(--danger); }
.match-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 8px;
  border-left: 3px solid transparent;
  background: rgba(255,255,255,0.02);
  margin-bottom: 5px;
  font-size: 12px;
}
.match-row.win  { border-left-color: var(--tier-diamond); }
.match-row.loss { border-left-color: var(--danger); }
.champ-icon {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  flex-shrink: 0;
  background: var(--road);
}
.match-main { display: flex; flex-direction: column; margin-right: auto; line-height: 1.3; }
.match-result { font-weight: 700; font-size: 11px; }
.match-row.win  .match-result { color: var(--tier-diamond); }
.match-row.loss .match-result { color: var(--danger); }
.match-champ { color: var(--ink-dim); font-size: 11px; }
.match-kda {
  font-family: 'Chakra Petch', sans-serif;
  font-weight: 600;
  white-space: nowrap;
}
.match-cs, .match-duration {
  color: var(--ink-faint);
  white-space: nowrap;
  font-size: 11px;
}

/* live-game badge */
.live-badge {
  margin-left: 8px;
  font-size: 10px;
  font-weight: 700;
  color: var(--danger);
  animation: livePulse 1s ease-in-out infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.35; }
}

/* --- the track itself --- */
.track {
  position: relative;
  height: 46px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--road);
  border: 1px solid var(--road-edge);
  box-shadow: inset 0 0 0 4px var(--road-edge);
}
.track::before {
  /* dashed center line, road-marking style */
  content: "";
  position: absolute;
  top: 50%; left: 4px; right: 18px;
  height: 3px;
  transform: translateY(-50%);
  background-image: repeating-linear-gradient(90deg, var(--finish) 0 16px, transparent 16px 30px);
  opacity: 0.55;
  border-radius: 2px;
}
.finish-flag {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 16px;
  background-image: repeating-conic-gradient(#0b0e14 0% 25%, #eef1f8 0% 50%);
  background-size: 8px 8px;
  border-left: 1px solid var(--road-edge);
}
.track-car {
  position: absolute;
  top: 50%;
  width: 54px;
  height: 26px;
  transform: translate(0, -50%);
  transition: left 0.9s cubic-bezier(.2,.8,.2,1);
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.45));
}
.track-car svg { width: 100%; height: 100%; display: block; }
.track-car::before {
  /* motion streaks trailing behind the car */
  content: "";
  position: absolute;
  top: 50%;
  right: 100%;
  width: 22px;
  height: 2px;
  transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, var(--ink-faint) 70%);
  opacity: 0.5;
}
/* live-game car animation — subtle wobble to read as "actively racing" */
.track-car.live {
  animation: liveWobble 0.55s ease-in-out infinite;
}
@keyframes liveWobble {
  0%, 100% { transform: translate(0, -50%); }
  50%      { transform: translate(3px, -52%) rotate(-1.5deg); }
}

.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--ink-faint);
  border: 1px dashed var(--line);
  border-radius: 12px;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WYŚCIG O LP <span class="flag">🏁</span></h1>
    <div class="status" id="status">Ładowanie…</div>
  </header>

  <div class="finish-banner"><span>META — CHALLENGER</span></div>

  <div class="lanes" id="lanes"></div>

  <div class="empty" id="emptyState" style="display:none;">
    <strong>Brak danych.</strong>
    <p>Sprawdź, czy serwer działa i czy config.json zawiera prawidłowe konta Riot.</p>
  </div>
</div>

<script>
const TIERS = {
  UNRANKED:     { label: "Bez rangi",     base: -400, color: "var(--tier-unranked)",     hasDiv: false },
  IRON:         { label: "Żelazo",        base: 0,    color: "var(--tier-iron)",         hasDiv: true },
  BRONZE:       { label: "Brąz",          base: 400,  color: "var(--tier-bronze)",       hasDiv: true },
  SILVER:       { label: "Srebro",        base: 800,  color: "var(--tier-silver)",       hasDiv: true },
  GOLD:         { label: "Złoto",         base: 1200, color: "var(--tier-gold)",         hasDiv: true },
  PLATINUM:     { label: "Platyna",       base: 1600, color: "var(--tier-platinum)",     hasDiv: true },
  EMERALD:      { label: "Szmaragd",      base: 2000, color: "var(--tier-emerald)",      hasDiv: true },
  DIAMOND:      { label: "Diament",       base: 2400, color: "var(--tier-diamond)",      hasDiv: true },
  MASTER:       { label: "Mistrz",        base: 2800, color: "var(--tier-master)",       hasDiv: false },
  GRANDMASTER:  { label: "Wielki Mistrz", base: 3200, color: "var(--tier-grandmaster)",  hasDiv: false },
  CHALLENGER:   { label: "Challenger",    base: 3600, color: "var(--tier-challenger)",   hasDiv: false },
  ERROR:        { label: "Błąd",          base: -800, color: "var(--danger)",            hasDiv: false }
};
const DIV_VAL = { IV: 0, III: 100, II: 200, I: 300 };

function score(p) {
  const t = TIERS[p.tier] || TIERS.UNRANKED;
  if (t.hasDiv) {
    return t.base + (DIV_VAL[p.division] || 0) + Math.max(0, Math.min(100, p.lp));
  }
  return t.base + Math.max(0, p.lp || 0);
}

function carSvg(color) {
  return `
    <svg viewBox="0 0 60 28" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="30" cy="24.5" rx="26" ry="2.5" fill="#000" opacity="0.35"/>
      <rect x="2" y="9" width="6" height="6" rx="1.5" fill="${color}"/>
      <path d="M6 18 L10 9 Q14 4 22 4 L36 4 Q43 4 47 9 L54 15 L54 19 Z" fill="${color}"/>
      <path d="M15 9 L20 5.5 H34 L40 9 Z" fill="#0b0e14" opacity="0.55"/>
      <rect x="4" y="16" width="52" height="6" rx="3" fill="${color}"/>
      <circle cx="15" cy="22" r="5.5" fill="#0b0e14"/>
      <circle cx="15" cy="22" r="2.1" fill="#8992ab"/>
      <circle cx="45" cy="22" r="5.5" fill="#0b0e14"/>
      <circle cx="45" cy="22" r="2.1" fill="#8992ab"/>
    </svg>
  `;
}

const lanesEl = document.getElementById("lanes");
const emptyEl = document.getElementById("emptyState");
const statusEl = document.getElementById("status");

function render(payload) {
  const players = payload.players || [];
  emptyEl.style.display = players.length ? "none" : "";

  const scores = players.map(score);
  const minScore = scores.length ? Math.min(...scores) : 0;
  const maxScore = scores.length ? Math.max(...scores) : 1;
  const range = Math.max(1, maxScore - minScore); // avoid divide-by-zero when everyone is tied

  const sorted = [...players].sort((a, b) => score(b) - score(a));

  lanesEl.innerHTML = "";

  sorted.forEach((p, idx) => {
    const t = TIERS[p.tier] || TIERS.UNRANKED;
    const s = score(p);
    // Spread cars across (almost) the full track based on how far apart
    // they actually are from each other right now, not on an absolute
    // ladder-wide scale. Last place sits near the start, leader near the
    // finish flag, and the gap between any two cars reflects their real
    // LP difference relative to the current field.
    const pct = 4 + ((s - minScore) / range) * 88;

    const lane = document.createElement("div");
    lane.className = "lane";

    const top = document.createElement("div");
    top.className = "lane-top";
    top.innerHTML = `
      <div class="rank-num">#${idx + 1}</div>
      <div class="name-block">
        <button class="nickname-btn" type="button" data-nickname="${encodeURIComponent(p.nickname)}">
          <span>${escapeHtml(p.nickname)}</span>
          <span class="chevron">▾</span>
        </button>
        ${p.inGame ? '<span class="live-badge">● NA MECZU</span>' : ''}
        <div class="riot-id">${escapeHtml(p.riotId || "")}</div>
      </div>
      <div class="wl">${p.wins ?? 0}W – ${p.losses ?? 0}P</div>
      <div class="stat">${t.label}${t.hasDiv ? " " + (p.division || "") : ""} · ${p.lp ?? 0} LP</div>
    `;

    const track = document.createElement("div");
    track.className = "track";
    track.innerHTML = `
      <div class="finish-flag"></div>
      <div class="track-car${p.inGame ? ' live' : ''}" style="left:calc(${pct}% - 4px)">${carSvg(t.color)}</div>
    `;

    const matchPanel = document.createElement("div");
    matchPanel.className = "match-panel" + (expandedNicknames.has(p.nickname) ? " open" : "");

    lane.appendChild(top);
    lane.appendChild(track);
    lane.appendChild(matchPanel);
    lanesEl.appendChild(lane);
  });

  // The whole board re-renders every 20s to keep LP live, which wipes any
  // open match-history panels. Re-populate (from client cache when fresh)
  // so an open panel doesn't visibly snap shut on refresh.
  expandedNicknames.forEach((nickname) => {
    const btn = lanesEl.querySelector(`.nickname-btn[data-nickname="${encodeURIComponent(nickname)}"]`);
    const panel = btn?.closest(".lane")?.querySelector(".match-panel");
    const chevron = btn?.querySelector(".chevron");
    if (chevron) chevron.textContent = "▴";
    if (panel) loadMatches(nickname, panel);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* --- expandable match history --- */
const expandedNicknames = new Set();
const matchDataCache = new Map(); // nickname -> { fetchedAt, matches }
const MATCH_CLIENT_CACHE_MS = 4 * 60 * 1000;

let ddragonVersion = null;
async function getDdragonVersion() {
  if (ddragonVersion) return ddragonVersion;
  try {
    const res = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
    const versions = await res.json();
    ddragonVersion = versions[0];
  } catch {
    ddragonVersion = '14.24.1'; // fallback if the version list can't be reached
  }
  return ddragonVersion;
}

function formatDuration(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

async function renderMatches(panel, matches) {
  if (!matches || !matches.length) {
    panel.innerHTML = '<div class="match-empty">Brak ostatnich gier rankingowych.</div>';
    return;
  }
  const version = await getDdragonVersion();
  panel.innerHTML = matches.map((m) => `
    <div class="match-row ${m.win ? 'win' : 'loss'}">
      <img class="champ-icon" src="https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${m.champion}.png" alt="${m.champion}" loading="lazy">
      <div class="match-main">
        <div class="match-result">${m.win ? 'Zwycięstwo' : 'Porażka'}</div>
        <div class="match-champ">${escapeHtml(m.champion)}</div>
      </div>
      <div class="match-kda">${m.kills}/${m.deaths}/${m.assists}</div>
      <div class="match-cs">${m.cs} CS</div>
      <div class="match-duration">${formatDuration(m.durationSeconds)}</div>
    </div>
  `).join('');
}

async function loadMatches(nickname, panel) {
  const cached = matchDataCache.get(nickname);
  if (cached && Date.now() - cached.fetchedAt < MATCH_CLIENT_CACHE_MS) {
    renderMatches(panel, cached.matches);
    return;
  }
  panel.innerHTML = '<div class="match-loading">Ładowanie meczów…</div>';
  try {
    const res = await fetch(`/api/matches/${encodeURIComponent(nickname)}`);
    if (!res.ok) throw new Error('bad response');
    const matches = await res.json();
    matchDataCache.set(nickname, { fetchedAt: Date.now(), matches });
    renderMatches(panel, matches);
  } catch (err) {
    panel.innerHTML = '<div class="match-error">Nie udało się wczytać historii meczów.</div>';
  }
}

lanesEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.nickname-btn');
  if (!btn) return;
  const nickname = decodeURIComponent(btn.dataset.nickname);
  const lane = btn.closest('.lane');
  const panel = lane.querySelector('.match-panel');
  const chevron = btn.querySelector('.chevron');

  if (expandedNicknames.has(nickname)) {
    expandedNicknames.delete(nickname);
    panel.classList.remove('open');
    chevron.textContent = '▾';
  } else {
    expandedNicknames.add(nickname);
    panel.classList.add('open');
    chevron.textContent = '▴';
    loadMatches(nickname, panel);
  }
});

async function refresh() {
  try {
    const res = await fetch('/api/lp', { cache: 'no-store' });
    const data = await res.json();
    render(data);
    if (data.updatedAt) {
      const secondsAgo = Math.round((Date.now() - new Date(data.updatedAt).getTime()) / 1000);
      statusEl.textContent = `Zaktualizowano ${secondsAgo}s temu`;
      statusEl.classList.toggle('stale', secondsAgo > 600);
    } else {
      statusEl.textContent = 'Oczekiwanie na pierwszą aktualizację…';
    }
  } catch (err) {
    statusEl.textContent = 'Nie można połączyć się z serwerem';
    statusEl.classList.add('stale');
  }
}

refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
